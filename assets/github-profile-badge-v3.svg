from matplotlib.textpath import TextPath
from matplotlib.font_manager import FontProperties

fp = FontProperties(family="DejaVu Sans", weight="bold", size=14)
tp = TextPath((0, 0), "@parvinaslanov", prop=fp)

# Convert TextPath vertices and codes to SVG path string
path_parts = []
for verts, code in tp.iter_segments():
    if code == tp.MOVETO:
        path_parts.append(f"M{verts[0]:.2f} {-verts[1]:.2f}")
    elif code == tp.LINETO:
        path_parts.append(f"L{verts[0]:.2f} {-verts[1]:.2f}")
    elif code == tp.CURVE3:
        path_parts.append(f"Q{verts[0]:.2f} {-verts[1]:.2f} {verts[2]:.2f} {-verts[3]:.2f}")
    elif code == tp.CURVE4:
        path_parts.append(f"C{verts[0]:.2f} {-verts[1]:.2f} {verts[2]:.2f} {-verts[3]:.2f} {verts[4]:.2f} {-verts[5]:.2f}")
    elif code == tp.CLOSEPOLY:
        path_parts.append("Z")

text_path_d = " ".join(path_parts)
bbox = tp.get_extents()
width = int(42 + bbox.width + 38)

svg_content = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="36" viewBox="0 0 {width} 36" fill="none">
  <rect width="{width}" height="36" rx="8" fill="#161b22"/>
  <rect x="0.75" y="0.75" width="{width - 1.5}" height="34.5" rx="7.25" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- GitHub Octocat Mark -->
  <g transform="translate(12, 8)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 0C4.475 0 0 4.475 0 10C0 14.425 2.8625 18.1625 6.8375 19.4875C7.3375 19.575 7.525 19.275 7.525 19.0125C7.525 18.775 7.5125 17.9875 7.5125 17.15C5 17.6125 4.35 16.5375 4.15 15.975C4.0375 15.6875 3.55 14.8 3.125 14.5625C2.775 14.375 2.275 13.9125 3.1125 13.9C3.9 13.8875 4.4625 14.625 4.65 14.925C5.55 16.4375 6.9875 16.0125 7.5625 15.75C7.65 15.1 7.9125 14.6625 8.2 14.4125C5.975 14.1625 3.65 13.3 3.65 9.475C3.65 8.3875 4.0375 7.4875 4.675 6.7875C4.575 6.5375 4.225 5.5125 4.775 4.1375C4.775 4.1375 5.6125 3.875 7.525 5.1625C8.325 4.9375 9.175 4.825 10.025 4.825C10.875 4.825 11.725 4.9375 12.525 5.1625C14.4375 3.8625 15.275 4.1375 15.275 4.1375C15.825 5.5125 15.475 6.5375 15.375 6.7875C16.0125 7.4875 16.4 8.375 16.4 9.475C16.4 13.3125 14.0625 14.1625 11.8375 14.4125C12.2 14.725 12.5125 15.325 12.5125 16.2625C12.5125 17.6 12.5 18.675 12.5 19.0125C12.5 19.275 12.6875 19.5875 13.1875 19.4875C17.1375 18.1625 20 14.4125 20 10C20 4.475 15.525 0 10 0Z" fill="#f0f6fc"/>
  </g>
  
  <!-- Handle Vector Text -->
  <g transform="translate(41, 22.5)">
    <path d="{text_path_d}" fill="#f0f6fc"/>
  </g>
  
  <!-- External Link Arrow -->
  <path d="M{width - 21} 14L{width - 16} 14M{width - 16} 14L{width - 16} 19M{width - 16} 14L{width - 23} 21" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
'''

with open("github-profile-badge-v3.svg", "w", encoding="utf-8") as f:
    f.write(svg_content)

print(f"Saved github-profile-badge-v3.svg (width={width})")
